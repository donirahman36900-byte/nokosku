<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NokosKu</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#0f1b3d;--mute:#6b7694;--line:#e4e8f3;--blue:#2563eb;--ok:#0f9d6c;--red:#dc3545;--sel:#eaf0ff}
@media(prefers-color-scheme:dark){:root{--bg:#0b1226;--card:#141d38;--ink:#eef1fb;--mute:#97a2c4;--line:#243055;--sel:#16254f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 90px}
main{max-width:560px;margin:0 auto;padding:16px}h1{font-size:22px;margin:6px 0}h2{font-size:16px;margin:0 0 8px}
.logo{font-weight:800;font-size:24px}.logo b{color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
input,textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;margin-bottom:10px}
button{font:600 14px inherit;font-family:inherit;border:0;border-radius:12px;padding:11px 14px;background:var(--blue);color:#fff;cursor:pointer}
button.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}button.r{background:var(--red)}button.s{padding:6px 10px;font-size:12px}button.w{width:100%}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;background:var(--card);color:var(--mute);border:1px solid var(--line)}.tabs button.on{background:var(--sel);color:var(--blue);border-color:var(--blue)}
.sub{color:var(--mute);font-size:13px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.tag{border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;background:#fff3cc;color:#8a6a00}.tag.paid{background:#e3f6ee;color:var(--ok)}.tag.rejected{background:#fde8ea;color:var(--red)}
.bal{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:0}.bal b{font-size:30px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;color:var(--mute);padding:8px 2px;font-size:12px}nav button.on{color:var(--blue);background:var(--sel)}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;margin:4px 0;background:var(--sel)}.msg.me{margin-left:auto;background:var(--blue);color:#fff}
#chat{height:300px;overflow-y:auto;margin-bottom:8px}.err{color:var(--red);font-size:13px;min-height:18px}
</style></head><body><main id="app"><div class="logo">Nokos<b>Ku</b></div><p class="sub" id="ld">Memuat…</p></main><nav id="nav" hidden></nav>
<script>
setTimeout(function(){var l=document.getElementById('ld');if(l)l.innerHTML='<b>Halaman gagal dimuat.</b><br>Kemungkinan: (1) <code>firebaseConfig</code> di index.html belum diisi, (2) file dibuka langsung dari penyimpanan HP/komputer. Buka lewat alamat hosting (https://...web.app) atau localhost, bukan file lokal, (3) internet memblokir gstatic.com.'},6000);
window.addEventListener('error',function(e){var l=document.getElementById('ld');if(l)l.textContent='Error: '+e.message});
window.addEventListener('unhandledrejection',function(e){var l=document.getElementById('ld');if(l)l.textContent='Error: '+((e.reason&&(e.reason.code||e.reason.message))||e.reason)});
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendEmailVerification,sendPasswordResetEmail,signInWithPopup,GoogleAuthProvider,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,collection,query,where,orderBy,limit,onSnapshot,serverTimestamp,increment,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
/* ===== CONFIG: tempel firebaseConfig milikmu di sini ===== */
const firebaseConfig={apiKey:"AIzaSyAegKK0PeIeG7Vq27LyUiDDXk3ExuC7BHc",authDomain:"nokos-ku.firebaseapp.com",projectId:"nokos-ku",appId:"1:785442528760:web:fe25d0e464c65c072e8a0d"};
if(firebaseConfig.apiKey==='ISI'){document.getElementById('ld').textContent='firebaseConfig belum diisi. Buka index.html, ganti nilai "ISI" dengan config dari Firebase Console.';throw new Error('config kosong')}
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),rp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null,prof=null,tab='home',mode='login',unsubs=[],err='';
const errMap={'auth/invalid-credential':'Email atau password salah.','auth/email-already-in-use':'Email sudah terdaftar.','auth/weak-password':'Password minimal 6 karakter.','auth/invalid-email':'Format email tidak valid.','auth/too-many-requests':'Terlalu banyak percobaan. Coba lagi nanti.','auth/popup-closed-by-user':'Login Google dibatalkan.'};
const E=e=>errMap[e.code]||('Gagal: '+(e.code||e.message));
const clear=()=>{unsubs.forEach(u=>u());unsubs=[]};

onAuthStateChanged(auth,async u=>{try{await boot(u)}catch(e){$('#nav').hidden=true;$('#app').innerHTML='<div class="logo">Nokos<b>Ku</b></div><div class="card"><h2>Terjadi masalah</h2><p class="sub">'+esc(e.code||e.message)+'</p><p class="sub">Jika "permission-denied": pastikan isi firestore.rules sudah di-Publish di Firebase Console.</p><button class="w" id="lo">Keluar</button></div>';const b=$('#lo');if(b)b.onclick=()=>signOut(auth)}});
async function boot(u){clear();me=u;prof=null;
 if(!u)return authView();
 await u.reload();me=auth.currentUser;
 if(!me.emailVerified)return verifyView();
 const ref=doc(db,'users',me.uid);let s=await getDoc(ref);
 if(!s.exists()){await setDoc(ref,{name:me.displayName||me.email.split('@')[0],email:me.email,saldo:0,role:'user',createdAt:serverTimestamp()});}
 unsubs.push(onSnapshot(ref,d=>{prof=d.data();if(['home','dep','prof'].includes(tab)||!$('#chat'))main()},e=>{$('#app').innerHTML='<div class="card"><h2>Terjadi masalah</h2><p class="sub">'+esc(e.code)+'</p></div>'}));
 tab='home';}

function authView(){$('#nav').hidden=true;
 const t=mode;
 $('#app').innerHTML=`<div class="logo">Nokos<b>Ku</b></div><p class="sub">Masuk dulu untuk memakai layanan.</p>
 <div class="tabs"><button class="${t=='login'?'on':''}" data-m="login">Masuk</button><button class="${t=='reg'?'on':''}" data-m="reg">Daftar</button></div>
 <div class="card">
 ${t=='reg'?'<input id="nm" placeholder="Nama">':''}
 <input id="em" type="email" placeholder="Email" autocomplete="email">
 ${t!='reset'?'<input id="pw" type="password" placeholder="Password (min. 6 karakter)" autocomplete="'+(t=='reg'?'new':'current')+'-password">':''}
 <div class="err" id="err">${esc(err)}</div>
 <button class="w" id="go">${t=='login'?'Masuk':t=='reg'?'Daftar dengan email':'Kirim link reset password'}</button>
 ${t!='reset'?'<p class="sub" style="text-align:center">atau</p><button class="g w" id="gg">Lanjut dengan Gmail</button>':''}
 <p class="sub" style="text-align:center;margin:12px 0 0">${t=='reset'?'<a href="#" data-m="login">Kembali masuk</a>':'<a href="#" data-m="reset">Lupa password?</a>'}</p></div>`;
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=e=>{e.preventDefault();mode=b.dataset.m;err='';authView()});
 $('#go').onclick=async()=>{const em=$('#em').value.trim(),pw=$('#pw')?.value;err='';
  try{if(t=='login')await signInWithEmailAndPassword(auth,em,pw);
   else if(t=='reg'){const c=await createUserWithEmailAndPassword(auth,em,pw);await sendEmailVerification(c.user);}
   else{await sendPasswordResetEmail(auth,em);$('#err').style.color='var(--ok)';$('#err').textContent='Jika email terdaftar, link reset sudah dikirim. Cek inbox dan spam. Kalau dulu daftar lewat Gmail, masuk saja dengan tombol Gmail.';}}
  catch(e){$('#err').textContent=E(e)}};
 if($('#gg'))$('#gg').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$('#err').textContent=E(e));}

function verifyView(){$('#nav').hidden=true;
 $('#app').innerHTML=`<div class="logo">Nokos<b>Ku</b></div><div class="card"><h2>Verifikasi email kamu</h2><p class="sub">Kami mengirim email ke <b>${esc(me.email)}</b>. Buka emailnya (cek juga spam), klik tombol atau link verifikasi di dalamnya, lalu kembali ke sini dan tekan tombol di bawah.</p><div class="err" id="err"></div>
 <button class="w" id="chk">Saya sudah verifikasi</button><p></p><button class="g w" id="rs">Kirim ulang email</button><p></p><button class="g w" id="lo">Keluar</button></div>`;
 $('#chk').onclick=async()=>{await me.reload();if(auth.currentUser.emailVerified){await auth.currentUser.getIdToken(true);location.reload()}else{$('#err').style.color='var(--red)';$('#err').textContent='Email belum terverifikasi. Klik link di email dulu.'}};
 $('#rs').onclick=()=>sendEmailVerification(me).then(()=>{$('#err').style.color='var(--ok)';$('#err').textContent='Email dikirim ulang.'}).catch(e=>{$('#err').style.color='var(--red)';$('#err').textContent=E(e)});
 $('#lo').onclick=()=>signOut(auth);}

function main(){if(!prof)return;clear2();
 const adm=prof.role==='admin';
 const T=[['home','Beranda'],['dep','Deposit'],['cs','CS'],['prof','Profil']];if(adm)T.push(['adm','Admin']);
 $('#nav').hidden=false;$('#nav').innerHTML=T.map(([k,l])=>`<button class="${tab===k?'on':''}" data-t="${k}">${l}</button>`).join('');
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;main()});
 ({home,dep,cs,prof:profile,adm:()=>adm&&admin()})[tab]();}
let sub=[];const clear2=()=>{sub.forEach(u=>u());sub=[]};

async function home(){const i=await getDoc(doc(db,'settings','info'));
 $('#app').innerHTML=`<div class="logo">Nokos<b>Ku</b></div><h1>Halo, ${esc(prof.name)}</h1><div class="card bal"><div>Saldo</div><b>${rp(prof.saldo)}</b></div>
 <div class="card"><h2>Pengumuman</h2><p class="sub" style="white-space:pre-wrap">${esc(i.data()?.announce||'Belum ada pengumuman.')}</p></div>`;}

function dep(){$('#app').innerHTML=`<h1>Deposit</h1><div class="card"><h2>Petunjuk pembayaran</h2><p class="sub" id="pay" style="white-space:pre-wrap">Memuat…</p>
 <input id="amt" type="number" inputmode="numeric" placeholder="Nominal (min. 2000)"><textarea id="note" placeholder="Catatan / nama pengirim (opsional)" rows="2"></textarea><div class="err" id="err"></div>
 <button class="w" id="sd">Saya sudah bayar, konfirmasi</button></div><div class="card"><h2>Riwayat deposit</h2><div id="hl"></div></div>`;
 getDoc(doc(db,'settings','info')).then(s=>$('#pay').textContent=s.data()?.payment||'Admin belum mengisi petunjuk pembayaran.');
 $('#sd').onclick=async()=>{const a=+$('#amt').value;if(!(a>=2000))return $('#err').textContent='Minimal Rp2.000.';
  try{await addDoc(collection(db,'deposits'),{uid:me.uid,email:me.email,name:prof.name,amount:a,note:$('#note').value,status:'pending',createdAt:serverTimestamp()});$('#amt').value='';$('#err').textContent='';}catch(e){$('#err').textContent=E(e)}};
 sub.push(onSnapshot(query(collection(db,'deposits'),where('uid','==',me.uid)),s=>{$('#hl').innerHTML=s.docs.map(d=>d.data()).sort((a,b)=>(b.createdAt?.seconds||9e9)-(a.createdAt?.seconds||9e9)).slice(0,30).map(x=>{return `<div class="row"><div>${rp(x.amount)}<div class="sub">${x.createdAt?.toDate().toLocaleString('id-ID')||''}</div></div><span class="tag ${x.status}">${x.status=='paid'?'Berhasil':x.status=='rejected'?'Ditolak':'Menunggu'}</span></div>`}).join('')||'<p class="sub">Belum ada deposit.</p>'},e=>$('#hl').textContent='Gagal memuat riwayat: '+e.code));}

function chatBox(uid,from){const q=query(collection(db,'chats',uid,'msgs'),orderBy('at'),limit(200));
 sub.push(onSnapshot(q,s=>{const c=$('#chat');c.innerHTML=s.docs.map(d=>{const x=d.data();return `<div class="msg ${x.from==from?'me':''}">${esc(x.text)}</div>`}).join('')||'<p class="sub">Belum ada pesan.</p>';c.scrollTop=c.scrollHeight}));
 $('#snd').onclick=async()=>{const t=$('#tx').value.trim();if(!t)return;$('#tx').value='';
  await setDoc(doc(db,'chats',uid),{uid,email:chatMail||me.email,last:t,at:serverTimestamp()},{merge:true});
  await addDoc(collection(db,'chats',uid,'msgs'),{from,text:t,at:serverTimestamp()});};}
let chatMail='';
function cs(){chatMail='';$('#app').innerHTML=`<h1>Customer service</h1><p class="sub">Tulis kendalamu, admin akan membalas di sini.</p><div class="card"><div id="chat"></div><input id="tx" placeholder="Tulis pesan…"><button class="w" id="snd">Kirim</button></div>`;chatBox(me.uid,'user');}

function profile(){$('#app').innerHTML=`<h1>Profil</h1><div class="card"><input id="nm" value="${esc(prof.name)}"><p class="sub">${esc(prof.email)}</p><button id="sv">Simpan nama</button></div><button class="g w" id="lo">Keluar</button>`;
 $('#sv').onclick=()=>updateDoc(doc(db,'users',me.uid),{name:$('#nm').value.trim()||prof.name});$('#lo').onclick=()=>signOut(auth);}

let atab='dep';
function admin(){$('#app').innerHTML=`<h1>Panel admin</h1><div class="tabs">${[['dep','Deposit'],['tx','Riwayat'],['usr','User'],['chat','CS'],['info','Info']].map(([k,l])=>`<button class="${atab==k?'on':''}" data-a="${k}">${l}</button>`).join('')}</div><div id="ad"></div>`;
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{atab=b.dataset.a;admin()});
 const L=(c,f,o=[])=>sub.push(onSnapshot(query(collection(db,c),...o),s=>f(s.docs.map(d=>({id:d.id,...d.data()}))),e=>$('#ad').textContent='Butuh index Firestore: lihat link di console (F12).'));
 const ad=$('#ad');
 if(atab=='dep'||atab=='tx')L('deposits',a=>{const list=atab=='dep'?a.filter(x=>x.status=='pending'):a;
  ad.innerHTML=`<div class="card">${list.map(x=>`<div class="row"><div><b>${rp(x.amount)}</b> · ${esc(x.name)}<div class="sub">${esc(x.email)}<br>${esc(x.note||'')}<br>${x.createdAt?.toDate().toLocaleString('id-ID')||''}</div></div>${x.status=='pending'?`<div><button class="s" data-ok="${x.id}">Konfirmasi</button> <button class="s r" data-no="${x.id}">Tolak</button></div>`:`<span class="tag ${x.status}">${x.status}</span>`}</div>`).join('')||'<p class="sub">Tidak ada data.</p>'}</div>`;
  ad.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{const x=a.find(y=>y.id==b.dataset.ok);const w=writeBatch(db);w.update(doc(db,'deposits',x.id),{status:'paid',by:'admin',paidAt:serverTimestamp()});w.update(doc(db,'users',x.uid),{saldo:increment(x.amount)});await w.commit();});
  ad.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>updateDoc(doc(db,'deposits',b.dataset.no),{status:'rejected',by:'admin'}));
 },[orderBy('createdAt','desc'),limit(200)]);
 if(atab=='usr')L('users',a=>{ad.innerHTML=`<div class="card">${a.map(u=>`<div class="row" style="display:block"><b>${esc(u.name)}</b> <span class="sub">${esc(u.email)} · ${u.role}</span><div style="display:flex;gap:6px;margin-top:6px"><input style="margin:0" data-n="${u.id}" value="${esc(u.name)}"><input style="margin:0" type="number" data-s="${u.id}" value="${u.saldo}"><button class="s" data-sv="${u.id}">Simpan</button></div></div>`).join('')}</div>`;
  ad.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{const id=b.dataset.sv;updateDoc(doc(db,'users',id),{name:ad.querySelector(`[data-n="${id}"]`).value,saldo:+ad.querySelector(`[data-s="${id}"]`).value});b.textContent='Tersimpan'})});
 if(atab=='chat')L('chats',a=>{ad.innerHTML=`<div class="card">${a.map(c=>`<div class="row"><div><b>${esc(c.email)}</b><div class="sub">${esc(c.last||'')}</div></div><button class="s" data-c="${c.id}" data-e="${esc(c.email)}">Buka</button></div>`).join('')||'<p class="sub">Belum ada chat.</p>'}</div>`;
  ad.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{clear2();chatMail=b.dataset.e;ad.innerHTML=`<p class="sub">Chat dengan ${esc(chatMail)}</p><div class="card"><div id="chat"></div><input id="tx" placeholder="Balas…"><button class="w" id="snd">Kirim</button></div>`;chatBox(b.dataset.c,'admin')})});
 if(atab=='info')getDoc(doc(db,'settings','info')).then(s=>{const d=s.data()||{};ad.innerHTML=`<div class="card"><h2>Pengumuman</h2><textarea id="an" rows="3">${esc(d.announce||'')}</textarea><h2>Petunjuk pembayaran</h2><textarea id="py" rows="4">${esc(d.payment||'')}</textarea><button id="si">Simpan</button></div>`;
  $('#si').onclick=async()=>{await setDoc(doc(db,'settings','info'),{announce:$('#an').value,payment:$('#py').value});$('#si').textContent='Tersimpan'}});}
</script>
</body></html>
